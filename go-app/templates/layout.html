<!doctype html>
<html>
<head>
    <title>{{ title }}</title>
    <meta name="description" content="{{ description }}">
    <meta name="keywords" content="jsfiddle, javascript, css, html, editor, ide, greasemonkey">
    <meta property="og:title" content="{{ title }}">
    <meta property="og:url" content="{{ url }}">
    <meta property="og:image" content="/static/images/webfiddle-icon256.png">
    <meta property="og:image:width" content="256"/>
    <meta property="og:image:height" content="256"/>
    <meta property="og:description" content="{{ description }}">
    <meta property="og:type" content="site">
    <meta property="og:site_name" content="WebFiddle">
    <meta property="fb:admins" content="337972272904903">
    <meta name="viewport" content="width=device-width, initial-scale=1, minimal-ui">
    <link rel="shortcut icon" href="/favicon.ico" type="image/x-icon"/>
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <meta name="twitter:card" content="summary">
    <meta name="twitter:site" content="@LeeLeePenkman">
    <meta name="twitter:title" content="{{ title }}">
    <meta name="twitter:description" content="{{ description }}">
    <meta name="twitter:image" content="/static/images/webfiddle-icon256.png">

    <script type="text/javascript" src="/static/bower_components/jquery/dist/jquery.min.js"></script>
    <script type="text/javascript" src="/static/bower_components/bootstrap/js/modal.js"></script>
    <script type="text/javascript" src="/static/bower_components/codemirror/lib/codemirror.js"></script>
    <script type="text/javascript" src="/static/bower_components/codemirror/mode/javascript/javascript.js"></script>
    <script type="text/javascript" src="/static/bower_components/codemirror/mode/css/css.js"></script>
    <script type="text/javascript" src="/static/bower_components/codemirror/addon/edit/matchbrackets.js"></script>
    <script type="text/javascript" src="/static/bower_components/codemirror/addon/edit/closebrackets.js"></script>
    <script type="text/javascript" src="/static/bower_components/codemirror/addon/hint/show-hint.js"></script>
    <script type="text/javascript" src="/static/bower_components/codemirror/addon/hint/css-hint.js"></script>
    <script type="text/javascript" src="/static/bower_components/codemirror/addon/hint/javascript-hint.js"></script>
    <script type="text/javascript" src="/static/bower_components/nunjucks/browser/nunjucks.min.js"></script>
    <script type="text/javascript" src="/static/ext-4.2.1.883/ext-all.js"></script>
    <script type="text/javascript" src="/static/js/templates/templates.js"></script>
    <script type="text/javascript" src="/static/js/inlet.js"></script>
    <script type="text/javascript" src="/static/js/webutils.js"></script>
    <script type="text/javascript" src="/static/js/fiddle.js"></script>
    <script type="text/javascript" src="/static/js/options.js"></script>
    <script type="text/javascript" src="/static/js/webframe.js"></script>
    <script type="text/javascript" src="/static/js/main.js"></script>
    <script type="text/javascript" src="/static/js/panes.js"></script>

    <script>
        (function (i, s, o, g, r, a, m) {
            i['GoogleAnalyticsObject'] = r;
            i[r] = i[r] || function () {
                (i[r].q = i[r].q || []).push(arguments)
            }, i[r].l = 1 * new Date();
            a = s.createElement(o),
                    m = s.getElementsByTagName(o)[0];
            a.async = 1;
            a.src = g;
            m.parentNode.insertBefore(a, m)
        })(window, document, 'script', '//www.google-analytics.com/analytics.js', 'ga');
        ga('create', 'UA-57646272-1', 'auto');
        ga('require', 'displayfeatures');
        ga('send', 'pageview');
    </script>

    {% block jsheaders %}{% endblock %}

    <link rel="stylesheet" href="/static/bower_components/font-awesome/css/font-awesome.min.css">
    <link rel="stylesheet" href="/static/bower_components/codemirror/lib/codemirror.css">
    <link rel="stylesheet" href="/static/bower_components/codemirror/addon/hint/show-hint.css">
    <link rel="stylesheet" href="/static/ext-4.2.1.883/resources/ext-theme-neptune/ext-theme-neptune-all.css">
    <link rel="stylesheet" href="/static/stylesheets/style.css">

    {% block cssheaders %}{% endblock %}
</head>

<body>
<div id="modal" class="modal fade" tabindex="-1" role="dialog" aria-hidden="true">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header">
                <button type="button" class="close" data-dismiss="modal" aria-hidden="true">
                    <i class="fa fa-times close-modal"></i>
                </button>
            </div>
            <div class="modal-body">
            </div>
        </div>
    </div>
</div>

<div class="main-header">
    <img src="/static/images/webfiddle-icon50x64.png"/>
    <h1 class="main-header_heading">Web<span class="webfiddle-light-blue">Fiddle</span></h1>
    <a id="save" class="btn header-btn" title="ctrl + s" href="#">
        <i class="fa fa-save"></i> Save <br/><span class="web-extra">ctrl+s</span>
    </a><a id="webfiddle_run" class="btn header-btn" title="ctrl + enter" href="#">
        <i class="fa fa-play"></i> Run <br/><span class="web-extra">ctrl+enter</span>
    </a><a id="share" class="btn header-btn" href="#">
        <i class="fa fa-share-alt"></i> Share
    </a>
    {% if user %}
    <span class="user-info">{{ user }}</span>
    <a class="btn header-btn" href="/logout">Logout</a>
    {% else %}
    <a class="btn header-btn" id="login-link" href="/login">Login</a>
    {% endif %}
</div>
<div id="main-content" class="main-content">
    {% block content %}{% endblock %}
</div>
</body>
</html>
